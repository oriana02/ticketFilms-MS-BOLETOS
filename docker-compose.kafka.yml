# Kafka con Zookeeper: 3 nodos Zookeeper + 3 brokers + Kafka UI (http://localhost:8090)
# Red compartida: docker network create ticketfilms-net
# En EC2, define KAFKA_EXTERNAL_HOST con la IP pública.
x-zk: &zk
  image: confluentinc/cp-zookeeper:7.6.1
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"

x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

services:
  zookeeper1:
    <<: *zk
    container_name: zookeeper1
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 1 }
  zookeeper2:
    <<: *zk
    container_name: zookeeper2
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 2 }
  zookeeper3:
    <<: *zk
    container_name: zookeeper3
    environment: { <<: *zk-env, ZOOKEEPER_SERVER_ID: 3 }

  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9092:9092"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9093:9093"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports: ["9094:9094"]
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka1, kafka2, kafka3]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ticketfilms
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092

networks:
  default:
    name: ticketfilms-net
    external: true
