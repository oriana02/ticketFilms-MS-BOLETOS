# Clúster RabbitMQ de 2 nodos + ms-boletos.
# Requiere la red compartida:  docker network create ticketfilms-net
services:
  rabbit1:
    image: rabbitmq:3.13-management
    container_name: rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: ticketfilms-cookie
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  rabbit2:
    image: rabbitmq:3.13-management
    container_name: rabbit2
    hostname: rabbit2
    depends_on:
      rabbit1:
        condition: service_healthy
    environment:
      RABBITMQ_ERLANG_COOKIE: ticketfilms-cookie
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5673:5672"
      - "15673:15672"
    # Arranca, se une al clúster de rabbit1 y vuelve a arrancar en primer plano
    command: >
      bash -c "rabbitmq-server -detached &&
      sleep 12 &&
      rabbitmqctl stop_app &&
      rabbitmqctl reset &&
      rabbitmqctl join_cluster rabbit@rabbit1 &&
      rabbitmqctl stop &&
      sleep 3 &&
      exec rabbitmq-server"

  ms-boletos:
    build: .
    container_name: ms-boletos
    depends_on:
      rabbit1:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_USERINFO_URL: ${COGNITO_USERINFO_URL}
      RABBITMQ_HOST: rabbit1
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ASIENTOS_BASE_URL: ${ASIENTOS_BASE_URL:-http://host.docker.internal:8082}

networks:
  default:
    name: ticketfilms-net
    external: true
