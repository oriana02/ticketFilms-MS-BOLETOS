# Solo ms-boletos. Requiere los clústeres corriendo y la red compartida:
#   docker network create ticketfilms-net
#   docker compose -f docker-compose.rabbit.yml up -d
#   docker compose -f docker-compose.kafka.yml up -d
services:
  ms-boletos:
    build: .
    container_name: ms-boletos
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_USERINFO_URL: ${COGNITO_USERINFO_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ASIENTOS_BASE_URL: ${ASIENTOS_BASE_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: ticketfilms-net
    external: true
