spring.application.name=ms-boletos
server.port=8083

# URL de ms-asientos
ms-asientos.base-url=${ASIENTOS_BASE_URL:http://localhost:8082}

# Resource Server — validación de JWT emitido por Google Auth Platform
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Precios por categoría de asiento (CLP)
precios.estandar=5500
precios.premium=7500

# Endpoint userInfo del Hosted UI de Cognito (para obtener el email del usuario)
cognito.userinfo-url=${COGNITO_USERINFO_URL}
